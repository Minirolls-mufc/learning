<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Romeo Spelling">
<link rel="apple-touch-icon" href="https://img.icons8.com/color/180/lego-head.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<title>Romeo's Spelling</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
  style="position:fixed;top:0;left:-1000px;opacity:0;font-size:16px;height:100px;">
<input type="file" id="fileInput" accept=".json" onchange="importData(this)" style="display:none">

<header>
  <div class="brand">
    <div class="avatar">R</div>
    <div>
      <div class="brand-name">Romeo's Spelling</div>
      <div class="brand-sub">Cloud Edition</div>
    </div>
  </div>
  <div id="headerBtn"></div>
</header>

<div id="app"></div>

<script src="js/core.js"></script>
<script src="js/sync.js"></script>
<script src="js/catalog-review.js"></script>
<script src="js/learning.js"></script>
<script src="js/practice.js"></script>
<script src="js/manager.js"></script>
<script src="js/records.js"></script>
</body>
</html>
