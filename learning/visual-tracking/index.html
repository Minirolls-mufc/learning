<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>积木机场视觉训练</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 84 64" aria-hidden="true">
            <rect x="7" y="38" width="70" height="16" rx="5" fill="#ffd447" stroke="#1f2937" stroke-width="3" />
            <circle cx="20" cy="35" r="7" fill="#ef4444" stroke="#1f2937" stroke-width="3" />
            <circle cx="42" cy="35" r="7" fill="#22c55e" stroke="#1f2937" stroke-width="3" />
            <circle cx="64" cy="35" r="7" fill="#3b82f6" stroke="#1f2937" stroke-width="3" />
            <path d="M18 30 L45 11 L66 29 L49 29 L43 42 L34 42 L39 29 Z" fill="#f97316" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" />
            <path d="M46 18 L70 10 L61 30" fill="#38bdf8" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" />
          </svg>
          <div>
            <h1>积木机场视觉训练</h1>
            <p>横向绕 8 · 数字积木</p>
          </div>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="timeBadge">03:00</span>
          <span id="targetBadge">圈数 0</span>
          <span id="starBadge">燃料星 0</span>
        </div>
      </header>

      <section class="workspace">
        <aside class="controls" aria-label="训练控制">
          <div class="control-group">
            <span class="group-label">模式</span>
            <div class="segmented" role="tablist" aria-label="训练模式">
              <button class="segment is-active" type="button" role="tab" aria-selected="true" data-mode="figure-eight">
                <span aria-hidden="true">∞</span>
                横向绕 8
              </button>
              <button class="segment" type="button" role="tab" aria-selected="false" data-mode="numbers">
                <span aria-hidden="true">25</span>
                数字积木
              </button>
            </div>
          </div>

          <div class="control-group">
            <label class="field-label" for="difficulty">难度</label>
            <select id="difficulty">
              <option value="easy">简单</option>
              <option value="standard" selected>标准</option>
              <option value="challenge">挑战</option>
            </select>
          </div>

          <div class="control-group">
            <label class="field-label" for="duration">时长</label>
            <select id="duration">
              <option value="60">1 分钟</option>
              <option value="180" selected>3 分钟</option>
              <option value="300">5 分钟</option>
            </select>
          </div>

          <div class="control-group">
            <span class="group-label">音乐</span>
            <button class="toggle is-on" id="soundToggle" type="button" aria-pressed="true">
              <span class="toggle-dot" aria-hidden="true"></span>
              <span id="soundLabel">开</span>
            </button>
          </div>

          <div class="action-row">
            <button class="primary-action" id="startPause" type="button">开始</button>
            <button class="ghost-action" id="reset" type="button">重来</button>
          </div>

          <div class="pilot-card" aria-label="训练状态">
            <svg class="pilot-plane" viewBox="0 0 150 92" aria-hidden="true">
              <path d="M24 55 L78 20 L124 54 L92 56 L77 77 L64 77 L69 57 Z" fill="#f97316" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
              <path d="M80 29 L131 15 L112 56" fill="#38bdf8" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
              <circle cx="52" cy="62" r="8" fill="#1f2937" />
              <circle cx="102" cy="62" r="8" fill="#1f2937" />
              <rect x="30" y="65" width="92" height="12" rx="5" fill="#ffd447" stroke="#1f2937" stroke-width="5" />
            </svg>
            <div>
              <strong id="sessionTitle">飞行训练中</strong>
              <span id="sessionLine">准备起飞</span>
            </div>
          </div>
        </aside>

        <section class="stage-wrap" aria-label="训练区域">
          <div class="sky-layer" aria-hidden="true">
            <span class="cloud cloud-one"></span>
            <span class="cloud cloud-two"></span>
            <span class="cloud cloud-three"></span>
          </div>

          <svg id="figureEightStage" class="training-stage" viewBox="0 0 1000 560" role="img" aria-label="横向绕 8 飞行路径">
            <defs>
              <pattern id="runwayStripes" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="72" height="72" fill="#e5e7eb" />
                <rect width="24" height="72" fill="#f8fafc" />
              </pattern>
            </defs>
            <rect x="0" y="0" width="1000" height="560" fill="transparent" />
            <rect x="94" y="434" width="812" height="74" rx="8" fill="url(#runwayStripes)" stroke="#1f2937" stroke-width="4" opacity="0.78" />
            <line x1="144" y1="471" x2="856" y2="471" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-dasharray="30 30" />
            <path id="flightPath" class="flight-path" d="M500 280 C640 88 902 102 902 280 C902 458 640 472 500 280 C360 88 98 102 98 280 C98 458 360 472 500 280" />
            <path class="flight-shadow" d="M500 280 C640 88 902 102 902 280 C902 458 640 472 500 280 C360 88 98 102 98 280 C98 458 360 472 500 280" />
            <g class="gate gate-red" transform="translate(98 280)">
              <rect x="-20" y="-20" width="40" height="40" rx="6" />
              <circle cx="-9" cy="-24" r="7" />
              <circle cx="9" cy="-24" r="7" />
            </g>
            <g class="gate gate-yellow" transform="translate(500 280)">
              <rect x="-22" y="-22" width="44" height="44" rx="6" />
              <circle cx="-10" cy="-27" r="7" />
              <circle cx="10" cy="-27" r="7" />
            </g>
            <g class="gate gate-blue" transform="translate(902 280)">
              <rect x="-20" y="-20" width="40" height="40" rx="6" />
              <circle cx="-9" cy="-24" r="7" />
              <circle cx="9" cy="-24" r="7" />
            </g>
            <g id="plane" class="plane-token">
              <path d="M-44 14 L3 -19 L43 12 L15 14 L2 34 L-11 34 L-5 15 Z" fill="#f97316" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
              <path d="M3 -12 L49 -24 L30 14" fill="#38bdf8" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
              <rect x="-35" y="20" width="72" height="12" rx="5" fill="#ffd447" stroke="#1f2937" stroke-width="5" />
              <circle cx="-22" cy="29" r="6" fill="#1f2937" />
              <circle cx="20" cy="29" r="6" fill="#1f2937" />
            </g>
          </svg>

          <div id="numberStage" class="training-stage number-stage is-hidden" aria-label="数字积木训练">
            <div class="number-field" id="numberField"></div>
          </div>
        </section>
      </section>

      <footer class="parent-note">
        家长提示：本页面是趣味视觉活动，不替代眼科或视光专业建议。
      </footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
