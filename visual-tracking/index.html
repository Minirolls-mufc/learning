<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>积木飞机场</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 96 72" aria-hidden="true">
            <rect x="9" y="38" width="30" height="24" rx="5" fill="#ef4444" stroke="#1f2937" stroke-width="4" />
            <rect x="57" y="38" width="30" height="24" rx="5" fill="#3b82f6" stroke="#1f2937" stroke-width="4" />
            <circle cx="20" cy="33" r="6" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
            <circle cx="31" cy="33" r="6" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
            <circle cx="68" cy="33" r="6" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
            <circle cx="79" cy="33" r="6" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
            <path d="M20 26 L50 8 L78 26 L58 26 L50 42 L40 42 L44 26 Z" fill="#f97316" stroke="#1f2937" stroke-width="4" stroke-linejoin="round" />
            <path d="M51 13 L84 7 L67 29" fill="#38bdf8" stroke="#1f2937" stroke-width="4" stroke-linejoin="round" />
          </svg>
          <div>
            <h1>积木飞机场</h1>
          </div>
        </div>
      </header>

      <section id="homeScreen" class="home-screen" aria-label="选择训练">
        <button class="game-choice choice-flight" type="button" data-start-mode="figure-eight">
          <svg class="choice-art" viewBox="0 0 360 230" aria-hidden="true">
            <path class="choice-eight" d="M180 114 C235 34 326 46 326 114 C326 182 235 194 180 114 C125 34 34 46 34 114 C34 182 125 194 180 114" />
            <g transform="translate(245 76) rotate(-18)">
              <path d="M-48 15 L4 -22 L50 14 L18 16 L4 39 L-12 39 L-6 17 Z" fill="#f97316" stroke="#1f2937" stroke-width="7" stroke-linejoin="round" />
              <path d="M5 -13 L58 -28 L35 15" fill="#38bdf8" stroke="#1f2937" stroke-width="7" stroke-linejoin="round" />
              <rect x="-38" y="24" width="82" height="15" rx="6" fill="#ffd447" stroke="#1f2937" stroke-width="7" />
            </g>
          </svg>
          <span>追踪训练</span>
          <strong>飞机追踪∞</strong>
        </button>

        <button class="game-choice choice-blocks" type="button" data-start-mode="numbers">
          <svg class="choice-art" viewBox="0 0 360 230" aria-hidden="true">
            <g transform="translate(48 42)">
              <rect width="86" height="70" rx="8" fill="#60a5fa" stroke="#1f2937" stroke-width="7" />
              <rect x="15" y="-15" width="22" height="17" rx="6" fill="#60a5fa" stroke="#1f2937" stroke-width="7" />
              <rect x="49" y="-15" width="22" height="17" rx="6" fill="#60a5fa" stroke="#1f2937" stroke-width="7" />
              <text x="43" y="49" text-anchor="middle">1</text>
            </g>
            <g transform="translate(142 108) rotate(-5)">
              <rect width="86" height="70" rx="8" fill="#ffd447" stroke="#1f2937" stroke-width="7" />
              <rect x="15" y="-15" width="22" height="17" rx="6" fill="#ffd447" stroke="#1f2937" stroke-width="7" />
              <rect x="49" y="-15" width="22" height="17" rx="6" fill="#ffd447" stroke="#1f2937" stroke-width="7" />
              <text x="43" y="49" text-anchor="middle">25</text>
            </g>
            <g transform="translate(238 52) rotate(7)">
              <rect width="86" height="70" rx="8" fill="#52d273" stroke="#1f2937" stroke-width="7" />
              <rect x="15" y="-15" width="22" height="17" rx="6" fill="#52d273" stroke="#1f2937" stroke-width="7" />
              <rect x="49" y="-15" width="22" height="17" rx="6" fill="#52d273" stroke="#1f2937" stroke-width="7" />
              <text x="43" y="49" text-anchor="middle">8</text>
            </g>
          </svg>
          <span>搜索训练</span>
          <strong>数字积木</strong>
        </button>
      </section>

      <section id="gameScreen" class="game-screen is-hidden" aria-label="训练游戏">
        <div class="game-toolbar">
          <button class="home-button" id="homeButton" type="button">首页</button>
          <div class="game-title">
            <span id="gameIcon" aria-hidden="true">✈</span>
            <div>
              <h2 id="gameTitle">飞机追踪∞</h2>
              <p id="gameSubtitle">沿着 ∞ 航线看飞机</p>
            </div>
          </div>
          <div class="status-strip" aria-live="polite">
            <span id="goalBadge">目标 10 圈</span>
            <span id="targetBadge">圈数 0/10</span>
            <span id="starBadge">燃料星 0</span>
          </div>
        </div>

        <div class="settings-bar" aria-label="训练控制">
          <label class="control-chip" for="speed">
            <span>速度</span>
            <select id="speed">
              <option value="slow">慢</option>
              <option value="normal" selected>正常</option>
            </select>
          </label>

          <label class="control-chip" for="loopGoal">
            <span>圈数</span>
            <select id="loopGoal">
              <option value="10" selected>10 圈</option>
              <option value="20">20 圈</option>
              <option value="30">30 圈</option>
            </select>
          </label>

          <label class="control-chip" for="aircraftStyle">
            <span>飞机</span>
            <select id="aircraftStyle">
              <option value="paper" selected>纸飞机</option>
              <option value="a380">A380</option>
              <option value="helicopter">直升机</option>
            </select>
          </label>

          <button class="toggle is-on" id="soundToggle" type="button" aria-pressed="true">
            <span class="toggle-dot" aria-hidden="true"></span>
            <span>音乐</span>
            <strong id="soundLabel">开</strong>
          </button>

          <button class="primary-action" id="startPause" type="button">开始</button>
          <button class="ghost-action" id="reset" type="button">重来</button>
        </div>

        <section class="stage-wrap" aria-label="训练区域">
          <div class="sky-layer" aria-hidden="true">
            <span class="cloud cloud-one"></span>
            <span class="cloud cloud-two"></span>
            <span class="cloud cloud-three"></span>
          </div>

          <svg id="figureEightStage" class="training-stage" viewBox="0 0 1000 620" role="img" aria-label="横向绕 8 飞行路径">
            <rect x="0" y="0" width="1000" height="620" fill="transparent" />
            <path id="flightShadow" class="flight-shadow" d="M500 310 C635 126 890 128 890 310 C890 492 635 494 500 310 C365 126 110 128 110 310 C110 492 365 494 500 310" />
            <path id="flightPath" class="flight-path" d="M500 310 C635 126 890 128 890 310 C890 492 635 494 500 310 C365 126 110 128 110 310 C110 492 365 494 500 310" />
            <g class="terminal terminal-red" transform="translate(112 310)">
              <rect class="terminal-side" x="-78" y="-20" width="24" height="54" rx="8" />
              <rect class="terminal-base" x="-54" y="-48" width="108" height="88" rx="10" />
              <rect class="terminal-window" x="-35" y="-23" width="20" height="14" rx="4" />
              <rect class="terminal-window" x="-6" y="-23" width="20" height="14" rx="4" />
              <rect class="terminal-window" x="23" y="-23" width="20" height="14" rx="4" />
              <circle cx="-31" cy="-60" r="12" />
              <circle cx="-1" cy="-60" r="12" />
              <circle cx="29" cy="-60" r="12" />
            </g>
            <g class="terminal terminal-blue" transform="translate(888 310)">
              <rect class="terminal-side" x="54" y="-20" width="24" height="54" rx="8" />
              <rect class="terminal-base" x="-54" y="-48" width="108" height="88" rx="10" />
              <rect class="terminal-window" x="-35" y="-23" width="20" height="14" rx="4" />
              <rect class="terminal-window" x="-6" y="-23" width="20" height="14" rx="4" />
              <rect class="terminal-window" x="23" y="-23" width="20" height="14" rx="4" />
              <circle cx="-31" cy="-60" r="12" />
              <circle cx="-1" cy="-60" r="12" />
              <circle cx="29" cy="-60" r="12" />
            </g>
            <g id="plane" class="plane-token">
              <g id="planeBody">
                <g class="aircraft-shape is-active" data-aircraft-shape="paper">
                  <path d="M-46 18 L7 -24 L51 16 L17 17 L3 39 L-12 39 L-5 19 Z" fill="#f97316" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <path d="M7 -16 L59 -29 L36 17" fill="#38bdf8" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <rect x="-36" y="24" width="76" height="13" rx="6" fill="#ffd447" stroke="#1f2937" stroke-width="5" />
                  <circle cx="-23" cy="33" r="6" fill="#1f2937" />
                  <circle cx="22" cy="33" r="6" fill="#1f2937" />
                </g>
                <g class="aircraft-shape" data-aircraft-shape="a380">
                  <path d="M-62 0 C-55 -17 -22 -24 24 -17 L72 -6 C83 -3 83 10 72 13 L24 22 C-20 29 -55 20 -62 4 Z" fill="#f8fafc" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <path d="M-16 -12 L-48 -50 L4 -24" fill="#60a5fa" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <path d="M-12 14 L-45 52 L7 26" fill="#60a5fa" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <path d="M-54 -4 L-76 -25 L-66 4" fill="#f97316" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <rect x="-5" y="-29" width="17" height="10" rx="5" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
                  <rect x="-4" y="21" width="17" height="10" rx="5" fill="#ffd447" stroke="#1f2937" stroke-width="4" />
                  <circle cx="52" cy="3" r="7" fill="#38bdf8" stroke="#1f2937" stroke-width="4" />
                </g>
                <g class="aircraft-shape" data-aircraft-shape="helicopter">
                  <line x1="-62" y1="-42" x2="62" y2="-42" stroke="#1f2937" stroke-width="8" stroke-linecap="round" />
                  <line x1="0" y1="-62" x2="0" y2="-22" stroke="#1f2937" stroke-width="6" stroke-linecap="round" />
                  <rect x="-46" y="-22" width="84" height="45" rx="18" fill="#ffd447" stroke="#1f2937" stroke-width="5" />
                  <path d="M25 -16 L64 -3 L31 16 Z" fill="#38bdf8" stroke="#1f2937" stroke-width="5" stroke-linejoin="round" />
                  <circle cx="-18" cy="-1" r="12" fill="#60a5fa" stroke="#1f2937" stroke-width="5" />
                  <path d="M-46 10 L-76 24" stroke="#1f2937" stroke-width="6" stroke-linecap="round" />
                  <line x1="-78" y1="4" x2="-78" y2="43" stroke="#1f2937" stroke-width="5" stroke-linecap="round" />
                  <line x1="-96" y1="24" x2="-60" y2="24" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
                  <line x1="-34" y1="36" x2="34" y2="36" stroke="#1f2937" stroke-width="7" stroke-linecap="round" />
                </g>
              </g>
            </g>
          </svg>

          <div id="numberStage" class="training-stage number-stage is-hidden" aria-label="数字积木训练">
            <div class="number-field" id="numberField"></div>
          </div>
        </section>
      </section>

    </main>

    <script src="./script.js"></script>
  </body>
</html>
